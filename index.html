(function(){try{

}

const base=new THREE.Mesh(new THREE.PlaneGeometry(400,400),M(0x9ccf8a));base.rotation.x=-Math.PI/2;base.position.set(12.5,-.4,12.5);base.receiveShadow=true;scene.add(base);
for(let i=0;i<6;i++){const c=new THREE.Group();for(let k=0;k<4;k++){const s=mesh(new THREE.SphereGeometry(1.2+Math.random()*.9,12,10),M(0xffffff,{transparent:true,opacity:.92}),k*1.4,Math.random()*.4,Math.random());s.scale.y=.6;c.add(s)}c.position.set(Math.random()*40-8,13+Math.random()*3,Math.random()*40-8);scene.add(c);clouds.push(c)}

/* ---------- tiles ---------- */

const IM=new THREE.InstancedMesh(tg,M(0xffffff),N*N),_tc=new THREE.Color();IM.receiveShadow=true;IM.frustumCulled=false;scene.add(IM);
class TV{constructor(t,i){const s=this;this.t=t;this.i=i;this.vis=true;this.py=0;this.sy=1;this.w=null;this.col=0xb79d6c;this.userData={t};
  this.position={get y(){return s.py},set y(v){s.py=v;s.up()}};this.scale={get y(){return s.sy},set y(v){s.sy=v;s.up()}};
  this.cm={color:{setHex(h){s.setCol(h);return this},getHex(){return s.col}}};this.setCol(this.col);this.up()}
 setCol(h){this.col=h;if(this.w)return;IM.setColorAt(this.i,_tc.setHex(h));IM.instanceColor.needsUpdate=true}
 up(){const w=this.w,t=this.t,a=IM.instanceMatrix.array,o=this.i*16,on=this.vis&&!w,sy=on?this.sy:0,sx=on?1:0;
  if(w){w.visible=this.vis;w.position.set(t.x+.5,this.py,t.y+.5);w.scale.y=this.sy}
  a[o]=sx;a[o+1]=0;a[o+2]=0;a[o+3]=0;a[o+4]=0;a[o+5]=sy;a[o+6]=0;a[o+7]=0;a[o+8]=0;a[o+9]=0;a[o+10]=sx;a[o+11]=0;a[o+12]=t.x+.5;a[o+13]=this.py;a[o+14]=t.y+.5;a[o+15]=1;IM.instanceMatrix.needsUpdate=true}

 else if(t.k=='w')col=r>.6?0xb79d6c:0xad9262;else if(t.k!='b')col=r>.5?0x6b4a2e:0x5f4128;
 if(t.road&&col!=null)col=0x4d4f55;if(col!=null)m.material.color.setHex(col);
 m.scale.y=sy;m.position.y=top-sy/2;t.top=top;
 const hh=((t.x*73856093)^(t.y*19349663))>>>0,want=o&&t.k=='w'&&!t.fence&&!t.fs&&!t.road&&hh%100<42;
 if(want&&!t.dec){t.dec=mkDec(hh%7);t.dec.userData.k=hh%7;t.dec.position.set(t.x+.5+(r-.5)*.4,0,t.y+.5);t.dec.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=false;o.updateMatrix();o.matrixAutoUpdate=false});scene.add(t.dec)}

  pl.add(mesh(new THREE.CylinderGeometry(.015,.025,.4,5),M(0x4f9a4a),0,.2,0));

 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1,fl);t.anisotropy=4;return tex[k]=t}

#splash .sun{position:absolute;left:50%;bottom:-130px;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:radial-gradient(#fff8d0 25%,#ffd26b 52%,rgba(255,200,100,0) 72%);animation:sunUp 3.8s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes sunUp{to{bottom:26%}}
#splash .cld{position:absolute;font-size:46px;opacity:.85;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));animation:cloud 9s linear infinite}
#splash .c1{top:12%;left:-60px}#splash .c2{top:24%;left:-60px;font-size:34px;animation-duration:12s;animation-delay:-4s}#splash .c3{top:7%;left:-60px;font-size:28px;animation-duration:15s;animation-delay:-9s}
@keyframes cloud{to{transform:translateX(calc(100vw + 140px))}}
#splash .hill{position:absolute;left:-15%;right:-15%;bottom:0;height:34%;background:linear-gradient(#78b45c,#356a3a);border-radius:50% 50% 0 0/26% 26% 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.2)}

#splash .field i{font-style:normal;font-size:30px;display:inline-block;transform-origin:50% 100%;animation:sprout .55s calc(var(--i)*.2s + .5s) both cubic-bezier(.3,1.7,.5,1)}
@keyframes sprout{from{transform:scaleY(0) rotate(-12deg)}to{transform:none}}
#splash .walker{position:absolute;bottom:25%;left:-90px;font-size:36px;white-space:nowrap;animation:walk 4.2s linear forwards}
#splash .walker span{display:inline-block;animation:hop .45s ease-in-out infinite}
#splash .walker span+span{animation-delay:.12s;margin-left:6px}
@keyframes walk{to{left:calc(100vw + 20px)}}
@keyframes hop{50%{transform:translateY(-8px)}}
#splash .ttl{position:absolute;left:0;right:0;top:15%;text-align:center}
#splash h1{margin:0;font:800 34px/1.25 system-ui,-apple-system,"Noto Sans KR",sans-serif;letter-spacing:5px;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 26px rgba(255,220,130,.7)}
#splash h1 span{display:inline-block;animation:drop .7s calc(var(--i)*.09s + .15s) both cubic-bezier(.3,1.8,.5,1)}
@keyframes drop{from{transform:translateY(-70px) scale(.4) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
#splash .ttl p{margin:6px 0 0;font-size:14px;letter-spacing:5px;opacity:.9;animation:drop 1s 1s both}
#splash .ld{position:absolute;left:14%;right:14%;bottom:5%;text-align:center}
#splash .ldb{height:12px;border-radius:7px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);overflow:hidden}
#splash .ldb i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#e8a83a,#fff0a8,#e8a83a);background-size:200% 100%;animation:fill 3.8s cubic-bezier(.4,.1,.3,1) forwards,shine 1s linear infinite}
@keyframes fill{to{width:100%}}@keyframes shine{to{background-position:-200% 0}}
#splash .ld small{display:block;margin-top:7px;font-size:12px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#splash .tip{margin-top:3px;opacity:.85;font-weight:500!important}
#splash .skip{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top,0px));font-size:11px;opacity:.7}

    if(inc>0)act++;tot+=inc;rows.push({r,inc,pairs,has:As.length})}
  const cap=4+2*hl(),eff=Math.min(tot,cap);return{rows,tot,eff,cap,act}}

  let streak=o.streak||0;
  if(o.day!==today){const y=new Date(now-864e5),yk=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();streak=(o.day===yk)?streak+1:1;if(loaded||o.last){const c=100+50*Math.min(streak,7),m=streak>=3?10:0;coins+=c;mat+=m;lines.push('🎫 출석 <b>'+streak+'일째</b> <b>+💰'+c+(m?' 🧱+'+m:'')+'</b>')}}
  writeFk({last:now,day:today,streak});
  if(!lines.length)return;const b=modalOpen('<div class="em">🌅</div><b>다시 오신 걸 환영해요!</b><p>'+lines.join('<br>')+'</p>');
  const bt=document.createElement('button');bt.textContent='받기';bt.onclick=()=>{give(coins,mat);confetti(30);chime([523,659,784]);modalClose()};b.appendChild(bt)}
function touchFk(){const o=readFk();o.last=Date.now();writeFk(o)}

/* ---------- 상단 상태 표시 + 패널 ---------- */
function badge(){const el=$q('fxs');if(!el)return;const f=F(),a=[],w=WX[f.wx.k]||WX.sun;
  if(f.wx.k!='sun')a.push('<span>'+w.e+' '+w.n+'</span>');
  for(const k in f.buf)if(f.buf[k]>0&&BN[k])a.push('<span class="hot">'+BN[k][0]+' '+Math.ceil(f.buf[k])+'s</span>');
  if(G.shR>0)a.push('<span>🛡</span>');if(G.shS>0)a.push('<span>💉</span>');if(G.shF>0)a.push('<span>🚒</span>');
  if(f.syn>0)a.push('<span>🤝 +'+f.syn.toFixed(1)+'/초</span>');
  const h=a.join('');if(el.dataset.h!==h){el.dataset.h=h;el.innerHTML=h;el.style.display=h?'flex':'none'}}

let tab='ch';const TABS=[['ch','🎯 도전'],['ac','🏅 업적'],['sy','🤝 시너지'],['sh','🏪 상점'],['mk','📈 시세·날씨'],['ad','💡 조언']];
const bar_=(a,b)=>'<div class="bar"><i style="width:'+clampN(a/b*100,0,100)+'%"></i></div>';
function vCh(){const f=F();let h='<div class="r"><span>🎖 칭호</span><b>'+title()+'</b></div><div class="r"><span>완료한 도전</span><b>'+f.ch.done+'개</b></div>';
  h+='<h4>🎯 진행 중인 도전 <small>(제한 시간 안에 달성하세요)</small></h4>';
  if(!f.ch.cur.length)h+='<div class="r"><small>잠시 후 새 도전이 나타나요…</small></div>';
  f.ch.cur.forEach(x=>{const p=chProg(x);if(!p[2])return;h+='<div class="fxc"><div class="h"><span>'+p[2].t(x.goal)+'</span><b>+💰'+x.rw+'</b></div>'+bar_(p[0],x.goal)+'<small>'+p[0]+' / '+x.goal+' · 남은 시간 '+Math.max(0,Math.ceil(x.left))+'초</small></div>'});
  return h+'<small>도전을 완료하면 코인을 받아요. 시간이 지나면 자동으로 새 도전으로 바뀌어요.</small>'}
function vAc(){const f=F(),n=A.filter(a=>f.ach[a[0]]).length;let h='<div class="r"><span>🏅 달성</span><b>'+n+' / '+A.length+'</b></div>'+bar_(n,A.length);
  A.slice().sort((a,b)=>(f.ach[b[0]]?1:0)-(f.ach[a[0]]?1:0)).forEach(a=>{const d=!!f.ach[a[0]];let v=[0,1];try{v=a[4]()}catch(e){}
   h+='<div class="fxc '+(d?'ok':'no')+'"><div class="h"><span>'+a[1]+' <b>'+a[2]+'</b></span><small>'+(d?'✔ 달성':'💰'+a[5]+(a[6]?' 🧱'+a[6]:''))+'</small></div><small>'+a[3]+(d?'':' · '+fmt(Math.min(v[0],v[1]))+' / '+fmt(v[1]))+'</small></div>'});return h}
function vSy(){if(!synC)synUpdate();const s=synC;let h='<div class="r"><span>🤝 시너지 수입</span><b>+'+s.eff.toFixed(1)+'코인/초</b></div><div class="r"><span>활성 시너지</span><b>'+s.act+' / '+SYN.length+'종</b></div><div class="r"><small>수입 한도 '+s.cap.toFixed(0)+'/초 (시청 레벨이 오를수록 늘어요)</small></div>';
  s.rows.forEach(o=>{h+='<div class="fxc '+(o.inc>0?'ok':'no')+'"><div class="h"><span>'+o.r.e+' <b>'+o.r.n+'</b></span><b>'+(o.inc>0?'+'+o.inc.toFixed(1)+'/초':'–')+'</b></div><small>'+(o.inc>0?'연결 '+o.pairs+'쌍':o.r.tip)+'</small></div>'});return h+'<small>건물을 서로 가까이 지을수록 수입이 늘어요. 도시 계획을 세워 보세요!</small>'}
function vSh(){const f=F();let h='<div class="r"><span>💰 보유</span><b>'+fmt(G.coins)+'</b></div><div class="r"><small>자재 시세 ×'+f.mk.p.toFixed(2)+' (시간에 따라 변해요)</small></div>';
  SHOP.forEach(it=>{const p=it.p(),why=it.ok(),dis=!!why||(p>0&&G.coins<p);h+='<div class="fxc"><div class="h"><span>'+it.e+' <b>'+it.n+'</b></span><button data-fx="buy" data-id="'+it.id+'"'+(dis?' disabled':'')+'>'+(p>0?'💰'+fmt(p):'💰+'+fmt(-p))+'</button></div><small>'+(why?why:it.d())+'</small></div>'});return h}
function vMk(){const f=F(),w=WX[f.wx.k]||WX.sun,nx=WX[f.wx.nx]||WX.sun;let h='<div class="r"><span>'+w.e+' 오늘 날씨 <b>'+w.n+'</b></span><small>'+w.d+'</small></div><div class="r"><span>다음 날씨 예보</span><b>'+nx.e+' '+nx.n+'</b></div><div class="r"><small>날씨가 바뀌기까지 약 '+Math.ceil(f.wx.t)+'초</small></div><h4>📈 농산물 시세</h4>';
  const m=MKI();if(m){m.keys().forEach(k=>{const v=m.xm(k),p=m.MP[k]==null?v:m.MP[k],ar=v>p+.01?'<span style="color:#7fd48f">▲</span>':v<p-.01?'<span style="color:#f2a36b">▼</span>':'–';h+='<div class="r"><span>'+m.lab(k)+'</span><span>'+ar+' <b>'+Math.round(v*100)+'%</b></span></div>'});h+='<small>같은 작물을 많이 팔면 가격이 내려가고, 시간이 지나면 회복해요. 여러 작물을 번갈아 키워 보세요.</small>'}
  else h+='<div class="r"><small>시세 정보를 불러오지 못했어요</small></div>';return h}
function advice(){const a=[],f=F();
  if(G.wf!=null&&G.wf<.99)a.push(['💧','물이 부족해요','우물·빗물집수조·정수장을 지어 물 공급을 늘리세요. (🏜 가뭄은 작물과 가축 생산을 깎아요)']);
  if(G.peff!=null&&G.peff<.99)a.push(['⚡','전력이 부족해요','태양광·풍력·폐기물발전소로 전력을 늘리세요. (🔌 정전은 수익을 깎아요)']);
  if((G.waste||0)>45)a.push(['🗑','쓰레기가 쌓이고 있어요','재활용센터·공원·폐기물발전소로 처리하세요. 60을 넘으면 오염이 시작돼요.']);
  const has=ty=>done_().some(t=>ty.includes(t.b.t));
  if((G.pop||0)>=12&&!has(['hosp','gh','cdc']))a.push(['🏥','보건 시설이 없어요','병원·방역센터가 있어야 감염병을 막을 수 있어요.']);
  if(done_().length>=3&&!has(['fire']))a.push(['🚒','소방서가 없어요','화재가 나면 코인을 크게 잃어요. 소방서를 지으세요.']);
  const need=8+hl()*8,dv=defNow();if(hl()>=1&&dv<need)a.push(['🛡','방어력 '+Math.round(dv)+' / '+need,'약탈자를 막으려면 방어 탑·경찰서·장벽이 필요해요. 급하면 상점의 경비 강화를 쓰세요.']);
  if(G.debt>0)a.push(['🏦','빚 '+fmt(G.debt)+'코인','이자가 분당 2%씩 붙어요 (약 '+fmt(G.debt*.02)+'코인/분). 여유가 생기면 먼저 갚는 게 이득이에요.']);
  if(G.hall<9&&G.coins>=420*G.hall)a.push(['🏛','시청 업그레이드 가능','코인이 충분해요. 새 땅이 열리고 건물 종류도 늘어요.']);
  if(f.syn<1&&cntB_()>=4)a.push(['🤝','시너지를 노려 보세요','건물을 서로 가까이 지으면 보너스 수입이 생겨요. 🤝 시너지 탭에서 추천 배치를 확인하세요.']);
  if(!a.length)a.push(['🌟','도시가 안정적이에요','자원과 방어에 문제가 없어요. 더 큰 건물과 시너지에 투자해 보세요!']);return a}
function vAd(){return advice().map(x=>'<div class="fxc"><div class="h"><span>'+x[0]+' <b>'+x[1]+'</b></span></div><small>'+x[2]+'</small></div>').join('')}
const VIEW={ch:vCh,ac:vAc,sy:vSy,sh:vSh,mk:vMk,ad:vAd};
const MYT='🎮 도전 · 상점';
function render(){const pb=$q('pb'),pt=$q('pt');if(!pb||!pt)return;const sc=pb.scrollTop;pt.textContent=MYT;
  pb.innerHTML='<div class="fxt">'+TABS.map(t=>'<button data-fx="tab" data-id="'+t[0]+'"'+(t[0]==tab?' class="on"':'')+'>'+t[1]+'</button>').join('')+'</div>'+(VIEW[tab]||vCh)();
  const pf=$q('pf');if(pf)pf.innerHTML='';pb.scrollTop=sc}
function openPanel(t){if(t)tab=t;const pn=$q('pnl');if(!pn)return;
  /* 다른 패널(현황·랭킹 등)이 열려 있으면 먼저 닫아서, 그쪽 자동 갱신이 내 화면을 덮어쓰지 않게 해요 */
  if(pn.style.display!='none'&&$q('pt')&&$q('pt').textContent!==MYT&&$q('px'))$q('px').click();
  pn.style.display='flex';render()}
const mine=()=>{const pn=$q('pnl'),pt=$q('pt');return pn&&pt&&pn.style.display!='none'&&pt.textContent===MYT};

/* ---------- 사진 ---------- */
function photo(){try{try{render3(0)}catch(e){}const cv_=(typeof cv!=='undefined')?cv:document.querySelector('canvas');const W=cv_.width,H=cv_.height,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(cv_,0,0,W,H);
  const g=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.35)');x.fillStyle=g;x.fillRect(0,0,W,H);
  let nm='';try{nm=localStorage.getItem(NMK)||''}catch(e){}const s=Math.max(1,Math.min(W,H)/520),pad=18*s;
  x.fillStyle='rgba(20,28,24,.62)';x.fillRect(0,H-64*s,W,64*s);x.textBaseline='middle';x.fillStyle='#fff';x.font='bold '+(20*s)+'px system-ui,sans-serif';x.fillText('🏙 '+(nm?nm+'의 도시':'나의 도시')+' · '+title(),pad,H-40*s);
  x.font=(14*s)+'px system-ui,sans-serif';x.fillStyle='#d9e8dc';x.fillText('경쟁력 '+fmt(G.score||0)+' · 시청 Lv'+hl()+' · 주민 '+fmt(G.pop||0)+'명',pad,H-17*s);
  x.textAlign='right';x.fillText('평온한 황무지 도시 3D',W-pad,H-17*s);
  const fl=$q('fxshot');if(fl){fl.classList.remove('on');void fl.offsetWidth;fl.classList.add('on')}
  c.toBlob(async blob=>{if(!blob)return;const file=new File([blob],'my-city.png',{type:'image/png'});F().photo++;
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'내 도시'});toast('📷 사진을 공유했어요');return}}catch(e){if(e&&e.name=='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-city.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('📷 사진을 저장했어요')},'image/png')}catch(e){toast('📷 사진을 찍지 못했어요')}}

/* ---------- 메인 틱 (게임 시간 기준) ---------- */
let acc=0,slowN=0;
function slow(s){const f=ens(),c=G.coins;if(lastC!=null&&c>lastC)f.earn+=c-lastC;lastC=c;
  const w=f.wx;w.t-=s;if(w.t<=0)wxChange();
  if(w.k=='storm'&&rnd()<.14){const e=$q('fxw');if(e){e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),170)}}
  f.mk.t-=s;if(f.mk.t<=0){f.mk.t=50+rnd()*40;f.mk.p=clampN(f.mk.p+(rnd()-.5)*.3,.7,1.4)}
  f.mk.e-=s;if(f.mk.e<=0){f.mk.e=160+rnd()*160;mktEvent()}
  const issue=(G.wf!=null&&G.wf<.99)||(G.peff!=null&&G.peff<.99)||(G.waste||0)>60||(G.sick>0);f.calm=issue?0:f.calm+s;
  f.enc.t-=s;if(f.enc.t<=0){if(!busyUI()&&(G.time||0)>40&&cntB_()>=3){f.enc.t=240+rnd()*200;showEnc()}else f.enc.t=15}
  chTick(s);slowN++;if(slowN%2==0){synUpdate();achCheck()}if(slowN%20==0)touchFk();badge();
  if(mine())render()}
function fxTick(dt){const f=ens();for(const k in f.buf){if(f.buf[k]>0){f.buf[k]-=dt;if(f.buf[k]<=0){delete f.buf[k];endBuff(k)}}}
  for(const k in f.cd)if(f.cd[k]>0)f.cd[k]-=dt;
  if(f.syn>0)G.coins+=f.syn*dt;if(f.buf.fest>0)G.coins+=(G.pop||0)*.3*dt;
  if(f.wx.k=='rain'){for(const t of T)if(t.k=='p')t.t+=dt*.15}
  acc+=dt;if(acc>=1){const s=acc;acc=0;try{slow(s)}catch(e){try{console.error('fx slow',e)}catch(_){}}}}

const kb=wrap('fxk');

window.__spd=1;sp.onclick=()=>{window.__spd=window.__spd%3+1;sp.textContent='⏩ ×'+window.__spd;toast(window.__spd>1?'⏩ '+window.__spd+'배속 — 시간이 더 빨리 흘러요':'▶ 보통 속도');};
window.__spdSet=v=>{window.__spd=v;sp.textContent='⏩ ×'+v};
ph.onclick=photo;
const mb=document.createElement('button');mb.id='fxbtn';mb.textContent='🎮 도전·상점';mb.onclick=()=>openPanel();
const top_=$q('top');if(top_)top_.appendChild(mb);
const pb0=$q('pb');if(pb0)pb0.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button[data-fx]');if(!b||b.disabled||!mine())return;
  if(b.dataset.fx=='tab'){tab=b.dataset.id;render()}else if(b.dataset.fx=='buy'){buy(b.dataset.id);render()}});
const wi=setInterval(()=>{if(welcomed){clearInterval(wi);return}if(!busyUI()&&!document.hidden){try{welcome()}catch(e){welcomed=1}}},800);
document.addEventListener('visibilitychange',()=>{if(document.hidden)touchFk()});addEventListener('pagehide',touchFk);

/* update 에 끼워 넣기 (배속 반복 호출에도 그대로 동작) */
const _u=window.update;if(typeof _u=='function')window.update=function(dt){_u(dt);try{fxTick(dt)}catch(e){}};
ens();wxView();synUpdate();badge();
window.__fx={F,synCalc,achCheck,buy,showEnc,photo,SHOP,ENC,A,CH,SYN,advice,fxTick,slow,render,openPanel,welcome,chNew};
setTimeout(()=>{try{if(!F().seenHint){F().seenHint=1;toast('🎮 메뉴(☰)에 도전·업적·시너지·상점이 생겼어요!')}}catch(e){}},9000);
}catch(e){try{console.error('v15 fun pack',e)}catch(_){}}})();
